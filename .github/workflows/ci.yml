name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Addon check
        run: |
          set -euo pipefail
          test -f addons/blazium_games/plugin.cfg
          if grep -R -n -E 'games_sdk|GDExtension|\.dll|LoginClient|ScriptedLobbyClient' addons; then
            echo "addon check failed"
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re, sys
          failed = False
          for path in pathlib.Path("addons").rglob("*.gd"):
              names = re.findall(r"(?m)^signal\s+([A-Za-z_][A-Za-z0-9_]*)", path.read_text(encoding="utf-8"))
              seen = {}
              for name in names:
                  seen[name] = seen.get(name, 0) + 1
              dups = [name for name, count in seen.items() if count > 1]
              if dups:
                  print(f"{path}: duplicate signal {', '.join(dups)}")
                  failed = True
          if failed:
              sys.exit(1)
          PY
