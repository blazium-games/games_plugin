name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Addon check
        run: |
          set -euo pipefail
          test -f addons/blazium_games/plugin.cfg
          if grep -R -n -E 'games_sdk|GDExtension|\.dll|LoginClient|ScriptedLobbyClient' addons; then
            echo "addon check failed"
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re, sys
          failed = False
          for path in pathlib.Path("addons").rglob("*.gd"):
              names = re.findall(r"(?m)^signal\s+([A-Za-z_][A-Za-z0-9_]*)", path.read_text(encoding="utf-8"))
              seen = {}
              for name in names:
                  seen[name] = seen.get(name, 0) + 1
              dups = [name for name, count in seen.items() if count > 1]
              if dups:
                  print(f"{path}: duplicate signal {', '.join(dups)}")
                  failed = True
          if failed:
              sys.exit(1)
          PY
      - name: No local paths or library source
        run: |
          python3 - <<'PY'
          import pathlib, sys
          roots = [pathlib.Path("addons"), pathlib.Path("docs"), pathlib.Path("tests"), pathlib.Path("README.md")]
          banned_names = {"session.cpp", "ipc_client.cpp", "ipc_client.hpp", "exports.cpp", "blaze.cpp", "blaze.hpp"}
          needles = ("blazium_ecosystem", "C:\\Users", "C:/Users/", "D:\\projects", "/Users/")
          failed = False
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(path for path in root.rglob("*") if path.is_file())
          for path in files:
              if path.name in banned_names:
                  print(f"library source name: {path}")
                  failed = True
              text = path.read_text(encoding="utf-8", errors="ignore")
              for needle in needles:
                  if needle in text:
                      print(f"local path in {path}")
                      failed = True
                      break
          if failed:
              sys.exit(1)
          PY
